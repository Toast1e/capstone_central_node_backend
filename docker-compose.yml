# Docker keeps everything a container prints, without limit, unless told
# otherwise. On a Pi that slowly fills the SD card, so each service keeps
# its newest 30 MB (3 files of 10 MB) and drops the rest.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Reads the LoRa gateway's serial output, stores readings in SQLite,
  # serves the JSON API on port 8000 (internal only — NGINX proxies to it).
  ingest:
    build: ./ingest
    restart: unless-stopped
    devices:
      # SERIAL_PORT comes from the .env file next to this compose file.
      # The host device is mapped to a stable name inside the container.
      - source: ${SERIAL_PORT}
        target: /dev/lora
        permissions: "rwm"
    environment:
      - SERIAL_PORT=/dev/lora
      - BAUD=115200
      - DB_PATH=/data/weather.db
    volumes:
      - weather-data:/data
    logging: *logging

  # NGINX: serves the PWA and reverse-proxies /api/ to the ingest service.
  # The only ports published on the Pi. The PWA is built from its own repo
  # (central_node_pwa, checked out next to this one) when the image builds.
  web:
    build:
      context: ./web
      additional_contexts:
        pwa: ${PWA_DIR:-../central_node_pwa}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS certificate (see certs/README.md). Without one the app is served
      # over plain HTTP and can't be installed to a phone's home screen.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - ingest
    logging: *logging

volumes:
  weather-data:
