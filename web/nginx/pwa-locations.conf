# Shared by http.conf and https.conf: serves the PWA's static export and
# proxies the API.

root  /usr/share/nginx/html;
index index.html;

# API → ingest container (Docker's internal DNS resolves the service name)
location /api/ {
    proxy_pass         http://ingest:8000;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# NGINX doesn't know the .webmanifest extension out of the box
location = /manifest.webmanifest {
    default_type application/manifest+json;
}

# Build assets have a content hash in their file names, so the file at a
# given URL never changes and browsers may cache it for good.
location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The static export writes one HTML file per route: /home → home.html
location / {
    try_files $uri $uri.html $uri/ =404;
}

error_page 404 /404.html;
