# HTTPS — used when certs/fullchain.pem and certs/privkey.pem exist.

# Send plain-HTTP visitors to the HTTPS site
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    include /etc/nginx/pwa-locations.conf;
}
