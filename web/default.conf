server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # API → ingest container (Docker's internal DNS resolves the service name)
    location /api/ {
        proxy_pass         http://ingest:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
