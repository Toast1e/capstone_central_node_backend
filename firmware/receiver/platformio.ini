; Receiver / gateway — plug this board into the Raspberry Pi over USB.
; Use the SAME board id you flashed the sender with (they're the same hardware
; family). heltec_wifi_lora_32_V3 works for the V3/V4 boards and Wireless
; Stick V3/V4: the SX1262 wiring is identical across all of them.

[env:receiver]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^6.6.0
; Native-USB boards (WiFi LoRa 32 V3/V4) need CDC-on-boot so Serial goes out
; the USB-C port. Boards with a CP2102 (Wireless Stick V3) ignore this flag.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
